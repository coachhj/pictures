<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사진 고르기</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&display=swap">
<style>
/* Layout: sticky header with 전체/담은 사진 tabs, masonry grid of photos; tapping a photo opens a full-screen viewer with 전체로·담기·빼기·담은 사진으로. */
:root{
  --bg:#f3f1ee; --surface:#ffffff; --fg:#23211f; --muted:#6f6a64; --line:#d9d4cd;
  --accent:#c2410c; --accent-fg:#ffffff; --scrim:rgba(20,18,16,.92);
  --font-display:"Noto Serif KR","Batang",serif;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161513; --surface:#22201d; --fg:#efebe5; --muted:#a09a92; --line:#38352f;
    --accent:#f08a4b; --accent-fg:#1a1208; --scrim:rgba(0,0,0,.94); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161513; --surface:#22201d; --fg:#efebe5; --muted:#a09a92; --line:#38352f;
  --accent:#f08a4b; --accent-fg:#1a1208; --scrim:rgba(0,0,0,.94); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body);
  font-size:15px; line-height:1.5; margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 120px; -webkit-tap-highlight-color:transparent;
}
body.lock{overflow:hidden}
header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  background:var(--bg); padding-block:14px 10px; border-bottom:1px solid var(--line);
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px;
}
h1{font-family:var(--font-display); font-size:21px; margin:0; font-weight:600; letter-spacing:-.01em; flex:1 1 auto}
.count{font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums}
.count b{color:var(--accent); font-size:17px}
.tabs{display:flex; gap:6px; flex:1 0 100%}
.tabs button{
  flex:1; min-height:40px; border:1px solid var(--line); background:var(--surface); color:var(--fg);
  font:inherit; font-weight:500; border-radius:8px; cursor:pointer;
}
.tabs button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-fg)}
.hint{margin:12px 0 4px; font-size:13px; color:var(--muted)}
.grid{columns:2; column-gap:10px; padding-top:8px}
@media (min-width:640px){.grid{columns:3}}
@media (min-width:980px){.grid{columns:4}}
/* 담은 사진 보기: 담은 순서대로 왼쪽→오른쪽 줄 배치, 길게 눌러 끌어서 순서 바꾸기 */
.grid.saved{columns:auto; display:grid; grid-template-columns:1fr; gap:14px; align-items:start; max-width:1400px; margin:0 auto}
@media (min-width:760px){.grid.saved{grid-template-columns:repeat(2,1fr)}}
.grid.saved .badge{font-size:20px}
.grid.saved .card{margin:0; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none}
.card img{pointer-events:none; -webkit-user-drag:none}
.card.pressing{transform:scale(.96); transition:transform .35s ease}
.card.dragging{opacity:.25}
.ghost{position:fixed; z-index:30; margin:0; pointer-events:none; box-shadow:0 14px 34px rgba(0,0,0,.4); transform:scale(1.06); opacity:.95}
.card{
  position:relative; display:block; width:100%; margin:0 0 10px; padding:0; border:0;
  break-inside:avoid; border-radius:8px; overflow:hidden; background:var(--line);
  cursor:pointer; outline-offset:2px; font:inherit; color:inherit;
}
.card img{display:block; width:100%; height:100%; object-fit:cover; transition:opacity .2s}
.card::after{content:""; position:absolute; inset:0; border-radius:8px; border:3px solid transparent; pointer-events:none}
.card.on::after{border-color:var(--accent)}
.card.on img{opacity:.92}
.badge{
  position:absolute; top:0; left:0; z-index:2; min-width:40px; padding:5px 10px 5px 9px;
  background:rgba(20,18,16,.72); color:#fff; font-weight:700; font-size:18px;
  font-variant-numeric:tabular-nums; letter-spacing:.02em; border-bottom-right-radius:8px;
  transform-origin:top left;
}
.card.on .badge{background:var(--accent); color:var(--accent-fg); animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.empty{padding:48px 0; text-align:center; color:var(--muted)}
.tray{
  position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--line);
  padding-top:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex; align-items:center; gap:10px;
}
.chips{flex:1; min-width:0; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; min-height:34px; align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; min-width:38px; min-height:34px; padding:0 10px; border:0; border-radius:17px;
  background:var(--accent); color:var(--accent-fg); font:inherit; font-weight:700; font-variant-numeric:tabular-nums; cursor:pointer;
}
.none{color:var(--muted); font-size:13px}
.clear{
  flex:0 0 auto; min-height:40px; padding:0 14px; border:1px solid var(--line); background:transparent; color:var(--fg);
  font:inherit; border-radius:8px; cursor:pointer;
}
.clear.arm{background:var(--accent); border-color:var(--accent); color:var(--accent-fg)}
.clear[disabled]{opacity:.4; cursor:default}

/* 개별 사진 화면 */
.viewer{
  position:fixed; inset:0; z-index:20; background:var(--scrim); display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.viewer[hidden]{display:none}
.viewer{background:#141210}
.stage{flex:1 1 auto; min-height:0; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:12px max(12px,env(safe-area-inset-left,0px))}
.stage img{display:block; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; border-radius:6px; pointer-events:none; user-select:none; -webkit-user-select:none}
.vbar{flex:0 0 auto; position:relative; z-index:1; background:#141210; border-top:1px solid rgba(255,255,255,.12); padding:10px max(16px,env(safe-area-inset-left,0px)) 14px}
.vnum{display:block; color:#fff; font-weight:700; font-size:20px; font-variant-numeric:tabular-nums; margin:0 0 8px}
.vnum small{font-size:14px; font-weight:500; color:var(--accent); margin-left:6px}
.vbtns{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; max-width:560px}
.vbtn{
  min-height:48px; padding:0 4px; border-radius:10px; border:1px solid rgba(255,255,255,.4);
  background:#2a2724; color:#fff; font:inherit; font-size:14px; font-weight:500; line-height:1.2;
  cursor:pointer; word-break:keep-all;
}
.vbtn.pri{background:#c2410c; border-color:#c2410c; color:#fff; font-weight:700}
.vbtn[disabled]{opacity:1; background:#1f1d1a; border-color:rgba(255,255,255,.2); color:#9a948c; cursor:default}
.vnum small{color:#f08a4b}
:focus-visible{outline:3px solid var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>이미지카드</h1>
  <div class="count" aria-live="polite">담은 사진 <b id="n">0</b> / 57</div>
  <div class="tabs" role="group" aria-label="보기">
    <button id="tAll" aria-pressed="true">Home</button>
    <button id="tSaved" aria-pressed="false">담은 사진</button>
  </div>
</header>
<p class="hint" id="hint">사진을 누르면 크게 보입니다. 큰 화면에서 담거나 뺄 수 있습니다.</p>
<main class="grid" id="grid"></main>
<div class="empty" id="empty" hidden>아직 담은 사진이 없습니다.</div>

<div class="tray">
  <div class="chips" id="chips"></div>
  <button class="clear" id="clear" disabled>비우기</button>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="큰 사진">
  <div class="stage"><img id="vimg" alt="" draggable="false"></div>
  <div class="vbar">
    <span class="vnum" id="vnum"></span>
    <div class="vbtns">
      <button class="vbtn" id="vAll" type="button">Home</button>
      <button class="vbtn pri" id="vAdd" type="button">담기</button>
      <button class="vbtn" id="vDel" type="button">빼기</button>
      <button class="vbtn" id="vSaved" type="button">담은 사진으로</button>
    </div>
  </div>
</div>

<script>
(function(){
  var RATIO={"01":0.67,"02":1.501,"03":1.487,"04":1.43,"05":1.368,"06":1.388,"07":0.68,"08":0.69,"09":1.5,"10":1.511,"11":1.506,"12":1.5,"13":1.818,"14":1.506,"15":1.634,"16":1.42,"17":1.616,"18":1.415,"19":1.506,"20":1.5,"21":1.5,"22":1.5,"23":1.5,"24":1.585,"25":1.5,"26":1.5,"27":1.506,"28":1.5,"29":1.308,"30":1.501,"31":1.333,"32":1.5,"33":1.501,"34":1.5,"35":1.778,"36":1.5,"37":1.48,"38":1.5,"39":1.501,"40":1.505,"41":1.779,"42":1.316,"43":1.5,"44":1.5,"45":1.504,"46":1.5,"47":1.333,"48":1.5,"49":1.198,"50":1.5,"51":1.505,"52":1.499,"53":1.333,"54":0.662,"55":1.499,"56":1.5,"57":1.037};
  var IDS=Object.keys(RATIO).sort();
  var KEY="imagecard-picks-v1";
  var picks=[], onlySaved=false, openId=null, armed=null;
  try{var s=JSON.parse(localStorage.getItem(KEY)||"[]"); if(Array.isArray(s)) picks=s.filter(function(x){return RATIO[x]});}catch(e){}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(picks));}catch(e){}}

  var grid=document.getElementById("grid"), chips=document.getElementById("chips"),
      nEl=document.getElementById("n"), clearBtn=document.getElementById("clear"),
      empty=document.getElementById("empty"), viewer=document.getElementById("viewer");
  var cards={};

  IDS.forEach(function(id){
    var b=document.createElement("button"); b.className="card"; b.type="button";
    b.style.aspectRatio=String(RATIO[id]); b.setAttribute("aria-label","사진 "+id+" 크게 보기");
    b.innerHTML='<img src="img/t/'+id+'.jpg?v=2" alt="" loading="lazy" decoding="async">'
      +'<span class="badge">'+id+'</span>';
    b.dataset.id=id;
    b.addEventListener("click",function(){ if(suppressClick){ suppressClick=false; return; } openViewer(id); });
    cards[id]=b; grid.appendChild(b);
  });

  function add(id){ if(picks.indexOf(id)<0){ picks.push(id); persist(); render(); } }
  function remove(id){ var i=picks.indexOf(id); if(i>=0){ picks.splice(i,1); persist(); render(); } }

  function render(){
    nEl.textContent=picks.length;
    IDS.forEach(function(id){
      var on=picks.indexOf(id)>=0, c=cards[id];
      c.classList.toggle("on",on);
      c.hidden = onlySaved && !on;
      c.style.order = on ? String(picks.indexOf(id)) : "";
      var im=c.querySelector("img"), want=(onlySaved && on ? "img/l/" : "img/t/")+id+".jpg?v=2";
      if(im.getAttribute("src")!==want) im.setAttribute("src",want);
    });
    grid.classList.toggle("saved",onlySaved);
    empty.hidden = !(onlySaved && picks.length===0);
    chips.innerHTML="";
    if(!picks.length){ var p=document.createElement("span"); p.className="none"; p.textContent="담은 사진의 번호가 여기에 쌓입니다."; chips.appendChild(p); }
    picks.forEach(function(id){
      var c=document.createElement("button"); c.className="chip"; c.textContent=id; c.type="button";
      c.setAttribute("aria-label","사진 "+id+" 크게 보기");
      c.addEventListener("click",function(){openViewer(id);});
      chips.appendChild(c);
    });
    clearBtn.disabled=!picks.length;
    if(!picks.length) disarm();
    if(openId) syncViewer();
  }

  function disarm(){ armed=null; clearBtn.classList.remove("arm"); clearBtn.textContent="비우기"; }
  clearBtn.addEventListener("click",function(){
    if(!armed){
      clearBtn.classList.add("arm"); clearBtn.textContent="정말 비우기";
      armed=setTimeout(disarm,3000); return;
    }
    clearTimeout(armed); picks=[]; persist(); disarm(); render();
  });

  var tAll=document.getElementById("tAll"), tSaved=document.getElementById("tSaved");
  function setView(v){
    onlySaved=v; tAll.setAttribute("aria-pressed",String(!v)); tSaved.setAttribute("aria-pressed",String(v));
    document.getElementById("hint").textContent = v
      ? "사진을 길게 누른 채 끌면 순서를 바꿀 수 있습니다. 짧게 누르면 크게 봅니다."
      : "사진을 누르면 크게 보입니다. 큰 화면에서 담거나 뺄 수 있습니다.";
    render(); window.scrollTo(0,0);
  }
  tAll.addEventListener("click",function(){setView(false);});
  tSaved.addEventListener("click",function(){setView(true);});

  var vimg=document.getElementById("vimg"), vnum=document.getElementById("vnum"),
      vAdd=document.getElementById("vAdd"), vDel=document.getElementById("vDel");
  function syncViewer(){
    var on=picks.indexOf(openId)>=0;
    vnum.innerHTML="No. "+openId+(on?'<small>담음</small>':"");
    vAdd.disabled=on; vDel.disabled=!on;
    vAdd.classList.toggle("pri",!on); vDel.classList.toggle("pri",on);
  }
  function openViewer(id){
    openId=id; vimg.src="img/l/"+id+".jpg?v=2"; vimg.alt="사진 "+id;
    viewer.hidden=false; document.body.classList.add("lock"); syncViewer();
  }
  function closeViewer(){ viewer.hidden=true; openId=null; vimg.removeAttribute("src"); document.body.classList.remove("lock"); }

  vAdd.addEventListener("click",function(){ add(openId); });
  vDel.addEventListener("click",function(){ remove(openId); });
  document.getElementById("vAll").addEventListener("click",function(){ closeViewer(); setView(false); });
  document.getElementById("vSaved").addEventListener("click",function(){ closeViewer(); setView(true); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&!viewer.hidden) closeViewer(); });

  /* 담은 사진 끌어서 순서 바꾸기 (마우스: 끌기 / 터치: 길게 누른 뒤 끌기) */
  var drag=null, suppressClick=false, ghost=null, rafId=0;
  grid.addEventListener("pointerdown",function(e){
    if(!onlySaved || (e.pointerType==="mouse" && e.button!==0)) return;
    var card=e.target.closest(".card"); if(!card || card.hidden) return;
    var st={id:card.dataset.id, card:card, sx:e.clientX, sy:e.clientY, lx:e.clientX, ly:e.clientY,
            pid:e.pointerId, mouse:e.pointerType==="mouse", active:false, timer:null};
    drag=st;
    if(!st.mouse){
      card.classList.add("pressing");
      st.timer=setTimeout(function(){ if(drag===st && !st.active) startDrag(); },380);
    }
  });
  document.addEventListener("pointermove",function(e){
    if(!drag || e.pointerId!==drag.pid) return;
    drag.lx=e.clientX; drag.ly=e.clientY;
    if(!drag.active){
      var d=Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy);
      if(drag.mouse){ if(d>6) startDrag(); }
      else if(d>10){ cancelPress(); }
      return;
    }
    e.preventDefault(); moveGhost(); reorderAt(drag.lx,drag.ly);
  });
  document.addEventListener("pointerup",endDrag);
  document.addEventListener("pointercancel",endDrag);
  document.addEventListener("touchmove",function(e){ if(drag && drag.active) e.preventDefault(); },{passive:false});
  grid.addEventListener("contextmenu",function(e){ if(onlySaved) e.preventDefault(); });

  function cancelPress(){ if(!drag) return; clearTimeout(drag.timer); drag.card.classList.remove("pressing"); drag=null; }
  function startDrag(){
    var c=drag.card, r=c.getBoundingClientRect();
    drag.active=true; drag.ox=drag.lx-r.left; drag.oy=drag.ly-r.top;
    c.classList.remove("pressing");
    ghost=c.cloneNode(true); ghost.classList.add("ghost"); ghost.classList.remove("dragging");
    ghost.style.width=r.width+"px"; ghost.style.height=r.height+"px";
    document.body.appendChild(ghost); moveGhost();
    c.classList.add("dragging");
    if(navigator.vibrate){ try{navigator.vibrate(15);}catch(_){} }
    rafId=requestAnimationFrame(autoScroll);
  }
  function moveGhost(){ if(ghost){ ghost.style.left=(drag.lx-drag.ox)+"px"; ghost.style.top=(drag.ly-drag.oy)+"px"; } }
  function reorderAt(x,y){
    var el=document.elementFromPoint(x,y), t=el && el.closest && el.closest(".card");
    if(!t || t===drag.card || t.hidden || !grid.contains(t)) return;
    var from=picks.indexOf(drag.id), to=picks.indexOf(t.dataset.id);
    if(from<0 || to<0) return;
    picks.splice(from,1); picks.splice(to,0,drag.id); render();
  }
  function autoScroll(){
    if(!drag || !drag.active) return;
    var top=document.querySelector("header").getBoundingClientRect().bottom+40,
        bottom=document.querySelector(".tray").getBoundingClientRect().top-40, v=0;
    if(drag.ly<top) v=-Math.min(18,(top-drag.ly)/3);
    else if(drag.ly>bottom) v=Math.min(18,(drag.ly-bottom)/3);
    if(v){ window.scrollBy(0,v); reorderAt(drag.lx,drag.ly); }
    rafId=requestAnimationFrame(autoScroll);
  }
  function endDrag(e){
    if(!drag || (e && e.pointerId!==drag.pid)) return;
    clearTimeout(drag.timer); cancelAnimationFrame(rafId);
    var c=drag.card, was=drag.active; drag=null;
    c.classList.remove("pressing","dragging");
    if(ghost){ ghost.remove(); ghost=null; }
    if(was){ persist(); render(); suppressClick=true; setTimeout(function(){ suppressClick=false; },400); }
  }

  render();
})();
</script>
</body>
</html>
